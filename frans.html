<html lang="nl"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Comic Sans MS","Trebuchet MS",Arial,sans-serif;background:linear-gradient(160deg,#4facfe,#8e44ad);min-height:100vh;color:#222;user-select:none}
#app{max-width:1000px;margin:0 auto;padding:12px}
h1{color:#fff;text-align:center;font-size:clamp(28px,5vw,48px);text-shadow:3px 3px 0 #ff6b6b;margin:10px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.big{border:none;border-radius:22px;padding:22px 10px;font-size:24px;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25);font-family:inherit;transition:transform .1s}

.btn{border:none;border-radius:14px;padding:12px 18px;font-size:20px;font-weight:bold;cursor:pointer;background:#fff;color:#6c5ce7;margin:5px;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.2)}

.name{font-size:36px;font-weight:bold;color:#6c5ce7}

.mc.open{background:#fff;color:#333}.mc.done{background:#2ecc71;color:#fff;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:6px;border-bottom:1px solid #eee}
.stars{color:#f9a825;font-size:22px;letter-spacing:2px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
#overlay .panel{max-width:440px;width:92%}
input{font-size:22px;padding:10px;border-radius:12px;border:3px solid #6c5ce7;width:80%;font-family:inherit;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.rec{font-size:34px;color:#e84393;font-weight:bold;animation:pop .6s infinite alternate}

.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
body{background:linear-gradient(160deg,#4facfe,#e84393)}
input,textarea{user-select:text;-webkit-user-select:text}

.c9{background:#0984e3}.c10{background:#d63031}.c0{background:#2d3436}
.acc{margin:8px 0}.ab{font-size:22px;min-width:46px;padding:8px;margin:3px;border-radius:10px;border:none;background:#ffeaa7;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}.row2 input{width:min(320px,80vw)}
.plus{font-size:34px;width:64px;height:64px;border-radius:50%;border:none;background:#2ecc71;color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #1e8449}

.lvlbar{height:18px;background:rgba(0,0,0,.25);border-radius:9px;overflow:hidden;margin-top:6px}.lvlbar div{height:100%;background:linear-gradient(90deg,#ffd32a,#2ecc71)}
.seg button{border:none;padding:10px 14px;font-size:17px;font-weight:bold;font-family:inherit;cursor:pointer;background:#fff;color:#6c5ce7;border-radius:12px;margin:3px}.seg button.on{background:#6c5ce7;color:#fff}
.sm{font-size:16px;padding:8px 10px}.lrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;border-bottom:1px solid #eee;padding:8px 0;text-align:left}.lrow .nm{flex:1;font-size:20px;font-weight:bold;min-width:150px}
.hint{font-size:28px;letter-spacing:4px;color:#e84393;font-weight:bold;min-height:36px}

.kb button{font-size:22px;min-width:44px;padding:8px;margin:3px;border:none;border-radius:10px;background:#74b9ff;color:#fff;font-weight:bold;cursor:pointer;font-family:inherit}.kb button:disabled{background:#ccc}
.fbok{color:#1e8449}.fbbad{color:#c0392b}.fbmid{color:#e67e22}
#confetti{background:transparent;border-radius:0;width:100%;height:100%}
</style></head><body>
<canvas id="confetti"></canvas>
<div id="app"></div>
<div id="overlay"><div class="panel" id="ovp"></div></div>
<script>
"use strict";
var $=function(id){return document.getElementById(id)};
var app=$("app");
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function qa(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel));}
// ---------- storage ----------
var ST={get:function(k,d){try{var v=localStorage.getItem("frw_"+k);return v?JSON.parse(v):d;}catch(e){return d;}},set:function(k,v){try{localStorage.setItem("frw_"+k,JSON.stringify(v));}catch(e){}}};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
var EXAMPLE=[["le chien","de hond"],["le chat","de kat"],["l'oiseau","de vogel"],["le cheval","het paard"],["la vache","de koe"],["le poisson","de vis"],["le lapin","het konijn"],["la souris","de muis"],["le cochon","het varken"],["l'éléphant","de olifant"],["la grenouille","de kikker"],["l'écureuil","de eekhoorn"]];
function mkList(name,pairs,active){return {id:uid(),name:name,active:!!active,words:pairs.map(function(p){return {id:uid(),fr:p[0],nl:p[1]};})};}
var DB=ST.get("db",null);
if(!DB||!DB.lists){DB={lists:[mkList("Voorbeeld: dieren",EXAMPLE,true)]};ST.set("db",DB);}
function save(){ST.set("db",DB);}
function getList(id){return DB.lists.filter(function(l){return l.id===id;})[0];}
function activeWords(){var seen={},out=[];DB.lists.forEach(function(l){if(!l.active)return;l.words.forEach(function(w){var k=norm(w.fr)+"|"+norm(w.nl);if(!seen[k]){seen[k]=1;out.push(w);}});});return out;}
// ---------- parsing ----------
var SEPS=["\t","=",";"," - "," – "];
function parseLine(s){s=String(s).replace(/\r/g,"").trim();if(!s||s.charAt(0)==="#")return null;
 for(var k=0;k<SEPS.length;k++){var i=s.indexOf(SEPS[k]);if(i>0){var a=s.slice(0,i).trim(),b=s.slice(i+SEPS[k].length).trim();if(a&&b)return [a,b];}}return null;}
function parseText(t){return String(t).split("\n").map(parseLine).filter(Boolean);}
function exportText(l){return "# Lijst: "+l.name+"\n"+l.words.map(function(w){return w.fr+" = "+w.nl;}).join("\n")+"\n";}
// ---------- answer checker ----------
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();}
function noAcc(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/æ/g,"ae");}
var ART=/^(les |le |la |l'|l |une |un |des |du |de la |de l'|het |een |de |d')/;
function noArt(s){return s.replace(ART,"").trim();}
function check(inp,target){var a=norm(inp);if(!a)return {r:"wrong",full:target};
 var alts=[norm(target)].concat(String(target).split("/").map(norm)).filter(Boolean);
 var i;for(i=0;i<alts.length;i++)if(a===alts[i])return {r:"ok",full:target};
 for(i=0;i<alts.length;i++)if(noArt(a)===noArt(alts[i]))return {r:"article",full:target};
 for(i=0;i<alts.length;i++)if(noAcc(a)===noAcc(alts[i])||noAcc(noArt(a))===noAcc(noArt(alts[i])))return {r:"accent",full:target};
 return {r:"wrong",full:target};}
function checkMsg(c){if(c.r==="ok")return '<span class="fbok">Super! ✔</span>';
 if(c.r==="article")return '<span class="fbok">Goed! 👍 Volledig is het: <b>'+esc(c.full)+'</b></span>';
 if(c.r==="accent")return '<span class="fbmid">Bijna! Let op het accent: <b>'+esc(c.full)+'</b> (halve punten)</span>';
 return '<span class="fbbad">Oei! Het juiste antwoord is <b>'+esc(c.full)+'</b></span>';}
// ---------- progress / stars ----------
function prog(id){return ST.get("prog",{})[id]||{g:0,f:0};}
function stars(id){var r=prog(id),s=r.g-r.f;return s>=5?3:s>=3?2:(r.g>=1&&s>=1)?1:0;}
function mark(w,ok){if(!w)return;var p=ST.get("prog",{});var r=p[w.id]||{g:0,f:0};if(ok)r.g++;else r.f++;p[w.id]=r;ST.set("prog",p);if(ok)addXP(2);}
function wgt(w){var r=prog(w.id);return 4-stars(w.id)+(r.f>r.g?2:0);}
function pickW(pool){var tot=0;pool.forEach(function(w){tot+=wgt(w);});var x=Math.random()*tot;for(var i=0;i<pool.length;i++){x-=wgt(pool[i]);if(x<=0)return pool[i];}return pool[pool.length-1];}
function deck(n){var pool=activeWords(),out=[],avail=pool.slice();while(out.length<n){if(!avail.length)avail=pool.slice();var w=pickW(avail);out.push(w);avail=avail.filter(function(x){return x!==w;});}return out;}
// ---------- XP / levels / streak ----------
var TITLES=["Croissant-beginner","Baguette-bakker","Kaas-proever","Crêpe-kampioen","Petit génie","Eiffeltoren-klimmer","Champion des mots","Super Français","Chevalier du vocabulaire","Roi de Paris"];
function lvlInfo(xp){var lv=1,need=50,base=0;while(xp>=base+need){base+=need;lv++;need=50+(lv-1)*30;}return {lv:lv,cur:xp-base,need:need,title:TITLES[Math.min(lv-1,TITLES.length-1)]};}
var pendingLvl=0;
function addXP(n){var x0=ST.get("xp",0),x=x0+n;ST.set("xp",x);if(lvlInfo(x).lv>lvlInfo(x0).lv)pendingLvl=lvlInfo(x).lv;}
function dkey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function yesterday(){var y=new Date();y.setDate(y.getDate()-1);return dkey(y);}
function touchDay(){var t=dkey(new Date()),s=ST.get("streak",{last:"",n:0});if(s.last===t)return;s.n=s.last===yesterday()?s.n+1:1;s.last=t;ST.set("streak",s);}
function streakN(){var s=ST.get("streak",{last:"",n:0});return (s.last===dkey(new Date())||s.last===yesterday())?s.n:0;}
// ---------- direction ----------
var DIRS={fr2nl:"🇫🇷 → 🇧🇪",nl2fr:"🇧🇪 → 🇫🇷",mix:"🔀 Gemengd"};
function dirSet(){return ST.get("dir","mix");}
function qdir(){var d=dirSet();return d==="mix"?(Math.random()<.5?"fr2nl":"nl2fr"):d;}
function makeQ(w,d){d=d||qdir();var fr=d==="fr2nl";var q={w:w,d:d,prompt:fr?w.fr:w.nl,answer:fr?w.nl:w.fr};
 var seen=[norm(q.answer)],others=[];sh(activeWords()).forEach(function(x){var v=fr?x.nl:x.fr;if(seen.indexOf(norm(v))<0){seen.push(norm(v));others.push(v);}});
 q.opts=sh([q.answer].concat(others.slice(0,3)));
 q.text=fr?"Wat betekent 🇫🇷 "+w.fr+" ?":"Hoe zeg je 🇧🇪 "+w.nl+" in het Frans?";
 q.short=fr?"Raak de vertaling van: "+w.fr:"Raak het Frans voor: "+w.nl;return q;}
// ---------- speech ----------
var voices=[];function loadV(){try{voices=speechSynthesis.getVoices()||[];}catch(e){}}
if("speechSynthesis" in window){loadV();try{speechSynthesis.onvoiceschanged=loadV;}catch(e){}}
function canSpeak(){if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined")return false;return !voices.length||voices.some(function(v){return /^fr/i.test(v.lang);});}
function speak(t){if(!canSpeak())return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.85;var v=voices.filter(function(v){return /^fr/i.test(v.lang);})[0];if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
// ---------- sound ----------
var muted=ST.get("mute",false),actx=null;
function tone(f,d,type,delay){if(muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();var t=actx.currentTime+(delay||0);var o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);}catch(e){}}
var SFX={ok:function(){tone(660,.12,"square");tone(880,.2,"square",.1);},mid:function(){tone(520,.15,"triangle");},bad:function(){tone(200,.3,"sawtooth");},shot:function(){tone(900,.08,"triangle");},boom:function(){tone(120,.35,"sawtooth");tone(80,.4,"square",.05);},win:function(){[523,659,784,1046].forEach(function(f,k){tone(f,.25,"square",k*.12);});}};
// ---------- confetti ----------
var cf=$("confetti"),cx=cf.getContext("2d"),parts=[],cfRun=false;
function confetti(){cf.width=innerWidth;cf.height=innerHeight;for(var i=0;i<160;i++)parts.push({x:Math.random()*cf.width,y:-20-Math.random()*cf.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,c:"hsl("+(Math.random()*360)+",90%,60%)",s:6+Math.random()*8,r:Math.random()*6});if(!cfRun){cfRun=true;requestAnimationFrame(cfl);}}
function cfl(){cx.clearRect(0,0,cf.width,cf.height);parts=parts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();return p.y<cf.height+20;});if(parts.length)requestAnimationFrame(cfl);else{cfRun=false;cx.clearRect(0,0,cf.width,cf.height);}}
// ---------- overlay ----------
function ov(html){$("ovp").innerHTML=html;$("overlay").style.display="flex";}
function ovClose(){$("overlay").style.display="none";}
function ask(title,fields,cb){ov('<div class="q">'+title+'</div>'+fields.map(function(f,k){return '<p style="margin:6px 0">'+f.label+'</p><input id="af'+k+'" value="'+esc(f.value||"")+'">';}).join("")+'<br><button class="btn" id="aok">✔ Opslaan</button><button class="btn" id="ano">Annuleren</button>');
 var go=function(){var vals=fields.map(function(f,k){return $("af"+k).value.trim();});if(vals.some(function(v){return !v;}))return;ovClose();cb(vals);};
 $("aok").onclick=go;$("ano").onclick=ovClose;fields.forEach(function(f,k){$("af"+k).onkeydown=function(e){if(e.key==="Enter")go();};});setTimeout(function(){var a=$("af0");if(a)a.focus();},30);}
// ---------- accent buttons ----------
var lastInput=null;document.addEventListener("focusin",function(e){if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))lastInput=e.target;});
function accBar(){return '<div class="acc">'+"é è ê à ç ô î ù ë ï".split(" ").map(function(c){return '<button class="ab" data-c="'+c+'">'+c+'</button>';}).join("")+'</div>';}
function wireAcc(){qa(".ab").forEach(function(b){b.onmousedown=function(e){e.preventDefault();};b.onclick=function(){var el=lastInput;if(!el||!document.body.contains(el))el=qa("input")[0];if(!el)return;var s=el.selectionStart==null?el.value.length:el.selectionStart,e2=el.selectionEnd==null?s:el.selectionEnd;el.value=el.value.slice(0,s)+b.dataset.c+el.value.slice(e2);el.focus();try{el.setSelectionRange(s+1,s+1);}catch(x){}};});}
// ---------- high scores ----------
var MODES={quiz:"❓ Quiz",typen:"⌨️ Typen",shoot:"🚀 Schieten",memory:"🃏 Memory",race:"⏱️ Tijdrace",galgje:"🪢 Galgje"};
function hs(m){return ST.get("hs_"+m,[]);}
function qualifies(m,s){var l=hs(m);return s>0&&(l.length<5||s>l[l.length-1].s);}
function endGame(m,score,extra){stopAll();addXP(10);var l=hs(m);var rec=score>0&&(l.length===0||score>l[0].s);var q=qualifies(m,score);if(score>0&&(rec||score>=(l[0]?l[0].s*.8:1)))confetti();if(rec)SFX.win();
 var h='<h2 style="color:#6c5ce7;text-shadow:none">Klaar!</h2>'+(rec?'<div class="rec">🏆 Nieuw record! 🏆</div>':'')+'<div class="q">Score: '+score+'</div>'+(extra?'<div class="fact">'+extra+'</div>':'');
 if(pendingLvl){h+='<div class="rec" style="font-size:24px">⬆️ Level '+pendingLvl+': '+lvlInfo(ST.get("xp",0)).title+'!</div>';confetti();pendingLvl=0;}
 if(q)h+='<p>Jij staat in de top 5! Hoe heet je?</p><input id="nm" maxlength="12" value="'+esc(ST.get("lastname",""))+'"><br><button class="btn c3" style="color:#fff" id="sv">Opslaan</button>';
 else h+='<button class="btn" id="sv">Verder</button>';
 ov(h);window.__lastEnd={m:m,score:score};$("sv").onclick=function(){if(q){var n=($("nm").value||"Speler").trim().slice(0,12)||"Speler";ST.set("lastname",n);l.push({n:n,s:score,d:new Date().toLocaleDateString("nl-BE")});l.sort(function(a,b){return b.s-a.s;});ST.set("hs_"+m,l.slice(0,5));}ovClose();showScores(m);};}
// ---------- header / timers ----------
function hdr(title,info){return '<div class="bar"><button class="btn" id="home">🏠 Menu</button><span>'+title+'</span><span id="info">'+(info||"")+'</span><button class="btn" id="mute">'+(muted?"🔇":"🔊")+'</button></div>';}
function wire(){$("home").onclick=home;$("mute").onclick=function(){muted=!muted;ST.set("mute",muted);this.textContent=muted?"🔇":"🔊";};}
var timers=[],raf=null,keyH=null,keyU=null;
function setKey(f){if(keyH)removeEventListener("keydown",keyH);keyH=f;if(f)addEventListener("keydown",f);}
function stopAll(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[];if(raf)cancelAnimationFrame(raf);raf=null;setKey(null);if(keyU){removeEventListener("keyup",keyU);keyU=null;}try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
function guard(fn,min){return function(){var n=activeWords().length;min=min||4;if(n<min){ov('<div class="q">Oeps! 🙈</div><p style="font-size:20px">Je hebt minstens <b>'+min+' woorden</b> nodig om te spelen. Nu heb je er '+n+'.</p><p>Voeg woorden toe of zet een lijst aan bij <b>Mijn woorden</b>.</p><button class="btn" id="gw">📝 Naar Mijn woorden</button><button class="btn" id="gok">OK</button>');$("gw").onclick=function(){ovClose();wordsHome();};$("gok").onclick=ovClose;return false;}stopAll();touchDay();fn.apply(null,arguments);return true;};}
// ---------- HOME ----------
function home(){stopAll();ovClose();var aw=activeWords(),known=aw.filter(function(w){return stars(w.id)>=2;}).length,L=lvlInfo(ST.get("xp",0)),sn=streakN(),d=dirSet();

function info(){var e=$("info");if(e)e.textContent="Zetten: "+moves+" · ⏱️ "+Math.floor((Date.now()-t0)/1000)+"s";}info();timers.push(setInterval(info,500));
qa(".mc").forEach(function(el){el.onclick=function(){var j=+el.dataset.j;if(lock||el.classList.contains("open")||el.classList.contains("done"))return;el.classList.add("open");el.textContent=cards[j].t;tone(500,.06);open.push(el);
 if(open.length===2){moves++;var a=cards[+open[0].dataset.j],b=cards[+open[1].dataset.j];if(a.w===b.w){SFX.ok();mark(a.w,true);open.forEach(function(x){x.classList.add("done");});open=[];found++;
  if(found===P){var s=Math.floor((Date.now()-t0)/1000);var score=Math.max(10,Math.round((1000-moves*20-s*5)*P/8));timers.push(setTimeout(function(){endGame("memory",score,moves+" zetten in "+s+" seconden");},600));}}
 else{lock=true;var pr=open;open=[];timers.push(setTimeout(function(){pr.forEach(function(x){x.classList.remove("open");x.textContent="❓";});lock=false;},900));}}info();};});}

function race(){var left=60,score=0,streak=0,cur=null;
app.innerHTML=hdr("⏱️ Tijdrace",'')+'<div class="panel" id="rp"></div>';wire();
function info(){var e=$("info");if(e)e.textContent="⏱️ "+left+"s · ⭐ "+score;}info();
timers.push(setInterval(function(){left--;info();if(left<=0){endGame("race",score,"in 60 seconden!");}},1000));
function next(){var p=$("rp");if(!p)return;cur=makeQ(pickW(activeWords()));p.innerHTML='<div class="q">'+esc(cur.text)+'</div><div class="opts">'+cur.opts.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+esc(o)+'</button>';}).join("")+'</div>';
 qa(".opt",p).forEach(function(b,j){b.onclick=function(){ans(j);};});}
function ans(j){if(left<=0||!cur)return;var ok=cur.opts[j]===cur.answer;mark(cur.w,ok);if(ok){streak++;score+=1+(streak>=5?1:0);SFX.ok();}else{streak=0;SFX.bad();var p=$("rp");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");}info();next();}

var HANG=['<line x1="10" y1="140" x2="110" y2="140"/>','<line x1="30" y1="140" x2="30" y2="10"/>','<line x1="30" y1="10" x2="90" y2="10"/><line x1="90" y1="10" x2="90" y2="30"/>','<circle cx="90" cy="42" r="12"/>','<line x1="90" y1="54" x2="90" y2="95"/>','<line x1="90" y1="65" x2="72" y2="82"/><line x1="90" y1="65" x2="108" y2="82"/>','<line x1="90" y1="95" x2="75" y2="120"/><line x1="90" y1="95" x2="105" y2="120"/>'];
function galgje(){var n=5,pool=deck(n),k=0,score=0,solved=0;
function r(){if(k>=n){endGame("galgje",score,solved+" van de "+n+" woorden geraden!");return;}
var w=pool[k],word=w.fr,guessed=[],wrong=0,done=false,MAX=HANG.length;
function base(ch){return noAcc(ch.toLowerCase());}
function isL(ch){return /[a-z]/.test(base(ch));}
function shown(){return word.split("").map(function(ch){return !isL(ch)||guessed.indexOf(base(ch))>=0||done?ch:"_";}).join(" ");}
function draw(){app.innerHTML=hdr("🪢 Galgje","Woord "+(k+1)+"/"+n+" · ⭐ "+score)+'<div class="panel"><div class="fact" style="font-size:22px">🇧🇪 Hint: <b>'+esc(w.nl)+'</b></div><svg viewBox="0 0 120 150" width="150" height="180" stroke="#6c5ce7" stroke-width="5" fill="none" stroke-linecap="round">'+HANG.slice(0,wrong).join("")+'</svg><div class="word">'+esc(shown())+'</div><div class="fact">Nog '+(MAX-wrong)+' fouten over</div><div class="kb">'+"abcdefghijklmnopqrstuvwxyz".split("").map(function(c){return '<button data-c="'+c+'" '+(guessed.indexOf(c)>=0||done?"disabled":"")+'>'+c+'</button>';}).join("")+'</div><div id="fb" class="q"></div></div>';wire();
 qa(".kb button").forEach(function(b){b.onclick=function(){guess(b.dataset.c);};});}
function guess(c){if(done||guessed.indexOf(c)>=0)return;guessed.push(c);var hit=word.split("").some(function(ch){return base(ch)===c;});if(hit)tone(700,.08,"square");else{wrong++;SFX.bad();}
 var won=word.split("").every(function(ch){return !isL(ch)||guessed.indexOf(base(ch))>=0;});
 if(won||wrong>=MAX){done=true;mark(w,won);if(won){solved++;var pts=10+(MAX-wrong)*2;score+=pts;SFX.ok();}draw();$("fb").innerHTML=(won?'<span class="fbok">Bravo! +'+pts+'</span>':'<span class="fbbad">Helaas!</span>')+' '+esc(w.fr)+' = '+esc(w.nl)+'<br><button class="btn" id="nx">Volgende ➡️</button>';$("nx").onclick=function(){k++;r();};if(canSpeak())speak(w.fr);}else draw();}
setKey(function(e){if(done&&e.key==="Enter"){$("nx").click();return;}var c=e.key&&e.key.length===1?base(e.key):"";if(/^[a-z]$/.test(c))guess(c);});
window.__galg={word:word,guess:guess};draw();}r();}
